name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt ruff
      - name: Check runtime imports and syntax
        run: |
          python -m ruff check --select F,E9 custom_components/govee_native
          python -m compileall -q custom_components/govee_native
      - name: Run regression suite
        run: python -m pytest -q
